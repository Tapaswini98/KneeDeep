# Everything in Docker (Postgres + API + web app on one port):
#   npm run docker:up      -> http://localhost:8080 (map) and /report (reporter page)
#   npm run docker:logs
#   npm run docker:down
# Only Postgres, for `npm run dev`:
#   npm run db:up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kneedeep
      POSTGRES_PASSWORD: kneedeep
      POSTGRES_DB: kneedeep
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kneedeep']
      interval: 2s
      timeout: 3s
      retries: 20

  # The API serves the built web app, so the frontend needs no separate container.
  # Runs as the staging tier by default: production build and strict checks, World ID simulator.
  #   DOCKER_APP_ENV=production  npm run docker:up   real World App only
  #   DOCKER_APP_ENV=development npm run docker:up   lenient (dev identities allowed)
  # (A separate name, so APP_ENV in .env, meant for `npm run dev`, never changes the container.)
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: ${DOCKER_APP_ENV:-staging}
      DATABASE_URL: postgres://kneedeep:kneedeep@postgres:5432/kneedeep
      MIGRATE_ON_BOOT: 'true'
    ports:
      - '8080:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
